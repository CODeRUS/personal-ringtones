name: Github CI build

on:
  push:
    tags:
      - '*'
  pull_request:
    branches:
      - master

env:
  RELEASE4: 4.6.0.13
  RELEASE5: 5.0.0.43

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Prepare sfos 4 build
      run: rm -rf RPMS

    - name: Build armv7hl
      uses: coderus/github-sfos-build@master
      with:
        release: ${{ env.RELEASE4 }}
        arch: armv7hl

    - name: Build aarch64
      uses: coderus/github-sfos-build@master
      with:
        release: ${{ env.RELEASE4 }}
        arch: aarch64

    - name: Build i486
      uses: coderus/github-sfos-build@master
      with:
        release: ${{ env.RELEASE4 }}
        arch: i486

    - name: Upload build result
      uses: actions/upload-artifact@v4
      with:
        name: sfos4
        path: RPMS

    # Release assets are keyed by filename. Both SDKs emit the same NEVRA.
    - name: Stash SFOS 4.6 RPMs
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/release-rpms"
        shopt -s nullglob
        copied=0
        for rpm in RPMS/*.rpm; do
          base="$(basename "$rpm" .rpm)"
          arch="${base##*.}"
          stem="${base%.*}"
          cp "$rpm" "$RUNNER_TEMP/release-rpms/${stem}.sfos4.6.${arch}.rpm"
          copied=1
        done
        if [ "$copied" -eq 0 ]; then
          echo "No SFOS 4.6 RPMs" >&2
          exit 1
        fi

    - name: Prepare sfos 5 build
      run: |
        rm -rf RPMS
        docker rm -vf $(docker ps -aq) ||:
        docker rmi -f $(docker images -aq) ||:
        docker system prune --force ||:

    - name: Build armv7hl
      uses: coderus/github-sfos-build@master
      with:
        release: ${{ env.RELEASE5 }}
        arch: armv7hl

    - name: Build aarch64
      uses: coderus/github-sfos-build@master
      with:
        release: ${{ env.RELEASE5 }}
        arch: aarch64

    - name: Build i486
      uses: coderus/github-sfos-build@master
      with:
        release: ${{ env.RELEASE5 }}
        arch: i486

    - name: Upload build result
      uses: actions/upload-artifact@v4
      with:
        name: sfos5
        path: RPMS

    - name: Stash SFOS 5.0 RPMs
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/release-rpms"
        shopt -s nullglob
        copied=0
        for rpm in RPMS/*.rpm; do
          base="$(basename "$rpm" .rpm)"
          arch="${base##*.}"
          stem="${base%.*}"
          cp "$rpm" "$RUNNER_TEMP/release-rpms/${stem}.sfos5.0.${arch}.rpm"
          copied=1
        done
        if [ "$copied" -eq 0 ]; then
          echo "No SFOS 5.0 RPMs" >&2
          exit 1
        fi

    - name: Create release
      if: contains(github.ref, 'release')
      run: |
        set -euo pipefail
        shopt -s nullglob
        sfos4=( "$RUNNER_TEMP/release-rpms/"*.sfos4.6.*.rpm )
        sfos5=( "$RUNNER_TEMP/release-rpms/"*.sfos5.0.*.rpm )
        if [ ${#sfos4[@]} -eq 0 ] || [ ${#sfos5[@]} -eq 0 ]; then
          echo "Release requires RPMs for both SFOS 4.6 and 5.0" >&2
          exit 1
        fi
        tag_name="${GITHUB_REF##*/}"
        gh release create "$tag_name" "${sfos4[@]}" "${sfos5[@]}" --title "$tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
